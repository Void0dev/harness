name: Coolify deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      deployment_evidence_run_id:
        description: Production predecessor evidence workflow run ID
        required: false
      deployment_evidence_artifact_id:
        description: Production predecessor evidence artifact ID
        required: false
      deployment_evidence_artifact_name:
        description: Production predecessor evidence artifact name
        required: false
      backend_evidence_run_id:
        description: Prepared backend release workflow run ID
        required: false
      backend_evidence_artifact_id:
        description: Prepared backend release artifact ID
        required: false
      backend_evidence_artifact_name:
        description: Prepared backend release artifact name
        required: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: coolify-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    uses: ./.github/workflows/ci.yml

  deploy-stage:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'stage' && github.event.workflow_run.conclusion == 'success'
    needs: verify
    runs-on: ubuntu-latest
    environment: stage
    concurrency:
      group: coolify-resource-${{ vars.COOLIFY_RESOURCE_UUID }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate triggering CI and resolve unique verified stage head
        env:
          TARGET_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_REVISION: ${{ github.event.workflow_run.head_sha }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_HEALTH_URL }}
        run: |
          python3 .harness/evidence_ledger.py resolve-stage-head \
            --repository "$GITHUB_REPOSITORY" --lane stage \
            --resource-uuid "$COOLIFY_RESOURCE_UUID" --health-url "$COOLIFY_HEALTH_URL" \
            --target-ci-run-id "$TARGET_CI_RUN_ID" --target-revision "$TARGET_REVISION" \
            --output .harness/predecessor-ledger.json \
            --deploy-record-output .harness/deployment-evidence/current.json
      - name: Pin, deploy, and verify exact staging revision
        id: deploy
        env:
          TARGET_REVISION: ${{ github.event.workflow_run.head_sha }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_HEALTH_URL }}
          COOLIFY_PIN_TOKEN: ${{ secrets.COOLIFY_PIN_TOKEN }}
          COOLIFY_PIN_TOKEN_SCOPES: ${{ vars.COOLIFY_PIN_TOKEN_SCOPES }}
          COOLIFY_PIN_TOKEN_EXPIRES_AT: ${{ vars.COOLIFY_PIN_TOKEN_EXPIRES_AT }}
          COOLIFY_PIN_TOKEN_IP_ALLOWLISTED: ${{ vars.COOLIFY_PIN_TOKEN_IP_ALLOWLISTED }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_DEPLOY_TOKEN_SCOPES: ${{ vars.COOLIFY_DEPLOY_TOKEN_SCOPES }}
          COOLIFY_DEPLOY_TOKEN_EXPIRES_AT: ${{ vars.COOLIFY_DEPLOY_TOKEN_EXPIRES_AT }}
          COOLIFY_DEPLOY_TOKEN_IP_ALLOWLISTED: ${{ vars.COOLIFY_DEPLOY_TOKEN_IP_ALLOWLISTED }}
        run: |
          python3 .harness/deploy_exact_revision.py --resource-uuid "$COOLIFY_RESOURCE_UUID" \
            --revision "$TARGET_REVISION" --health-url "$COOLIFY_HEALTH_URL"
          python3 .harness/evidence_ledger.py successor --lane stage \
            --predecessor .harness/predecessor-ledger.json \
            --deploy-record .harness/deployment-evidence/current.json \
            --target-ci-run-id "${{ github.event.workflow_run.id }}" \
            --target-revision "$TARGET_REVISION" --output evidence.json
      - name: Attest successor evidence
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: evidence.json
      - name: Publish successor evidence
        id: publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployment-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Compensate to verified predecessor
        if: failure() && steps.deploy.outcome == 'success'
        run: python3 .harness/evidence_ledger.py compensate --predecessor .harness/predecessor-ledger.json

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: coolify-resource-${{ vars.COOLIFY_RESOURCE_UUID }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Resolve explicit deployment and backend evidence locators
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_evidence_run_id }}
          DEPLOYMENT_ARTIFACT_ID: ${{ inputs.deployment_evidence_artifact_id }}
          DEPLOYMENT_ARTIFACT_NAME: ${{ inputs.deployment_evidence_artifact_name }}
          BACKEND_RUN_ID: ${{ inputs.backend_evidence_run_id }}
          BACKEND_ARTIFACT_ID: ${{ inputs.backend_evidence_artifact_id }}
          BACKEND_ARTIFACT_NAME: ${{ inputs.backend_evidence_artifact_name }}
        run: |
          python3 .harness/evidence_ledger.py resolve-locator --schema deployment-success-v1 \
            --lane production --run-id "$DEPLOYMENT_RUN_ID" --artifact-id "$DEPLOYMENT_ARTIFACT_ID" \
            --artifact-name "$DEPLOYMENT_ARTIFACT_NAME" --output .harness/predecessor-ledger.json \
            --deploy-record-output .harness/deployment-evidence/current.json
          python3 .harness/evidence_ledger.py resolve-locator --schema backend-release-v1 \
            --lane production --run-id "$BACKEND_RUN_ID" --artifact-id "$BACKEND_ARTIFACT_ID" \
            --artifact-name "$BACKEND_ARTIFACT_NAME" --expected-revision "$GITHUB_SHA" \
            --output .harness/backend-release.json
      - name: Pin, deploy, and verify exact production revision
        id: deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_HEALTH_URL }}
          COOLIFY_PIN_TOKEN: ${{ secrets.COOLIFY_PIN_TOKEN }}
          COOLIFY_PIN_TOKEN_SCOPES: ${{ vars.COOLIFY_PIN_TOKEN_SCOPES }}
          COOLIFY_PIN_TOKEN_EXPIRES_AT: ${{ vars.COOLIFY_PIN_TOKEN_EXPIRES_AT }}
          COOLIFY_PIN_TOKEN_IP_ALLOWLISTED: ${{ vars.COOLIFY_PIN_TOKEN_IP_ALLOWLISTED }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_DEPLOY_TOKEN_SCOPES: ${{ vars.COOLIFY_DEPLOY_TOKEN_SCOPES }}
          COOLIFY_DEPLOY_TOKEN_EXPIRES_AT: ${{ vars.COOLIFY_DEPLOY_TOKEN_EXPIRES_AT }}
          COOLIFY_DEPLOY_TOKEN_IP_ALLOWLISTED: ${{ vars.COOLIFY_DEPLOY_TOKEN_IP_ALLOWLISTED }}
        run: |
          python3 .harness/deploy_exact_revision.py --resource-uuid "$COOLIFY_RESOURCE_UUID" \
            --revision "$GITHUB_SHA" --health-url "$COOLIFY_HEALTH_URL"
          python3 .harness/evidence_ledger.py successor --lane production \
            --predecessor .harness/predecessor-ledger.json \
            --deploy-record .harness/deployment-evidence/current.json \
            --target-revision "$GITHUB_SHA" --output evidence.json
          python3 .harness/evidence_ledger.py consume --deployment .harness/predecessor-ledger.json \
            --backend .harness/backend-release.json --application-revision "$GITHUB_SHA" \
            --resource-uuid "$COOLIFY_RESOURCE_UUID" --output consumption.json
      - name: Attest successor evidence
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: evidence.json
      - name: Publish successor evidence
        id: publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployment-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Attest backend consumption
        id: attest-consumption
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: consumption.json
      - name: Publish backend consumption
        id: publish-consumption
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumption-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: consumption.json
          if-no-files-found: error
          retention-days: 90
      - name: Compensate to verified predecessor
        if: failure() && steps.deploy.outcome == 'success'
        run: python3 .harness/evidence_ledger.py compensate --predecessor .harness/predecessor-ledger.json
