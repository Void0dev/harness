name: Prepare and attest production backend release

on:
  workflow_dispatch:
    inputs:
      prepared_revision:
        description: Full application revision supported by this expand-only release
        required: true
      resource_uuid:
        description: Exact production Coolify application UUID used for shared serialization
        required: true
__HARNESS_BACKEND_INPUTS__
      previous_backend_evidence_run_id:
        description: Previous backend evidence run ID; empty only for sequence 0
        required: false
      previous_backend_evidence_artifact_id:
        description: Previous backend evidence artifact ID
        required: false
      previous_backend_evidence_artifact_name:
        description: Previous backend evidence artifact name
        required: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: coolify-resource-${{ inputs.resource_uuid }}
  cancel-in-progress: false

jobs:
__HARNESS_BACKEND_PREPARE_JOBS__

  aggregate-backend-release:
    if: github.ref_name == 'main'
    needs: __HARNESS_BACKEND_AGGREGATE_NEEDS__
    runs-on: __HARNESS_PRODUCTION_RUNNER__
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: backend-receipt-*
          path: .harness/backend-receipts
          merge-multiple: true
      - name: Verify predecessor and aggregate all capability receipts
        env:
          RELEASE_REVISION: ${{ inputs.prepared_revision }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_backend_evidence_run_id }}
          PREVIOUS_ARTIFACT_ID: ${{ inputs.previous_backend_evidence_artifact_id }}
          PREVIOUS_ARTIFACT_NAME: ${{ inputs.previous_backend_evidence_artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .harness/evidence_ledger.py aggregate-backend \
            --receipts .harness/backend-receipts --release-revision "$RELEASE_REVISION" \
            --previous-run-id "$PREVIOUS_RUN_ID" --previous-artifact-id "$PREVIOUS_ARTIFACT_ID" \
            --previous-artifact-name "$PREVIOUS_ARTIFACT_NAME" __HARNESS_EXPECTED_CAPABILITIES__ \
            --schema backend-release-v1 \
            --output evidence.json
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 90
