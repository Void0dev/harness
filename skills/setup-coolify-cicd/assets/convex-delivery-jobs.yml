# Merge these jobs under `jobs:` in coolify-deploy.yml for Convex projects.
# Replace both placeholders with the exact commands from .harness/config.json.
backend-stage:
  if: github.ref_name == 'stage'
  needs: verify
  runs-on: ubuntu-latest
  environment: stage
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Deploy Convex staging backend
      run: __HARNESS_CONVEX_DEPLOY_STAGE__
      env:
        CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

backend-production:
  if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
  needs: verify
  runs-on: ubuntu-latest
  environment: production
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Deploy Convex production backend
      run: __HARNESS_CONVEX_DEPLOY_PRODUCTION__
      env:
        CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
