# internal input to workflow_compiler.py
migration-stage:
  if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'stage' && github.event.workflow_run.conclusion == 'success'
  runs-on: ubuntu-latest
  environment: stage
  steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: __HARNESS_MIGRATE_STAGE__
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

migration-production:
  if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
  needs: verify
  runs-on: ubuntu-latest
  environment: production
  steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.sha }}
    - name: Verify attested aggregate backend evidence contains PostgreSQL receipt
      env:
        BACKEND_RUN_ID: ${{ inputs.backend_evidence_run_id }}
        BACKEND_ARTIFACT_ID: ${{ inputs.backend_evidence_artifact_id }}
        BACKEND_ARTIFACT_NAME: ${{ inputs.backend_evidence_artifact_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 .harness/evidence_ledger.py resolve-locator --schema backend-release-v1 \
          --lane production --run-id "$BACKEND_RUN_ID" --artifact-id "$BACKEND_ARTIFACT_ID" \
          --artifact-name "$BACKEND_ARTIFACT_NAME" --expected-revision "$GITHUB_SHA" \
          --output .harness/backend-release.json
        python3 .harness/evidence_ledger.py verify-backend-capability \
          --evidence .harness/backend-release.json --capability postgres --revision "$GITHUB_SHA"
# __HARNESS_MIGRATE_PRODUCTION__ executes only in protected backend-prepare.yml.
