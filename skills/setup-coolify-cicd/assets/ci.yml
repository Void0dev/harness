name: CI

on:
  pull_request:
    branches: [stage, main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: __HARNESS_INSTALL__
      - run: __HARNESS_TEST__
      - run: __HARNESS_LINT__
      - run: __HARNESS_TYPECHECK__
      - run: __HARNESS_BUILD__
