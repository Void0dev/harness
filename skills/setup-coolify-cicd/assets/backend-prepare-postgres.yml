postgres-prepare-production:
  if: github.ref_name == 'main'
  runs-on: __HARNESS_PRODUCTION_RUNNER__
  environment: production
  steps:
    - name: Validate prepared revision is the dispatched main commit
      env:
        PREPARED_REVISION: ${{ inputs.prepared_revision }}
        REQUESTED_RESOURCE_UUID: ${{ inputs.resource_uuid }}
        COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
      run: test "$PREPARED_REVISION" = "$GITHUB_SHA" && test "$REQUESTED_RESOURCE_UUID" = "$COOLIFY_RESOURCE_UUID"
    - name: Check out trusted main workflow tooling
      id: trusted-checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.sha }}
        path: trusted
    - name: Record immutable trusted helper commit
      id: trusted-commit
      run: printf 'sha=%s\n' "$(git -C trusted rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Check out prepared application source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ inputs.prepared_revision }}
        path: source
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: source/package-lock.json
    - run: __HARNESS_INSTALL__
      working-directory: source
    - name: Run reviewed expand-only PostgreSQL preparation
      run: __HARNESS_PREPARE_POSTGRES__
      working-directory: source
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
    - name: Emit PostgreSQL capability receipt
      env:
        RESOURCE_REF: ${{ inputs.postgres_resource_ref }}
        PREVIOUS_REVISION: ${{ inputs.postgres_previous_revision }}
        BACKUP_REF: ${{ inputs.postgres_backup_ref }}
        RECEIPT_SHA256: ${{ inputs.postgres_receipt_sha256 }}
        TRUSTED_SHA: ${{ steps.trusted-commit.outputs.sha }}
      run: |
        /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
          GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          TRUSTED_SHA="$TRUSTED_SHA" RESOURCE_REF="$RESOURCE_REF" \
          PREVIOUS_REVISION="$PREVIOUS_REVISION" BACKUP_REF="$BACKUP_REF" \
          RECEIPT_SHA256="$RECEIPT_SHA256" /bin/bash -c '
            set -euo pipefail
            /usr/bin/git -C trusted show "$TRUSTED_SHA:.harness/evidence_ledger.py" | \
              /usr/bin/python3 - backend-receipt --capability postgres \
                --resource-ref "$RESOURCE_REF" --previous-revision "$PREVIOUS_REVISION" \
                --backup-ref "$BACKUP_REF" --receipt-sha256 "$RECEIPT_SHA256" \
                --output postgres.json
          '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: backend-receipt-postgres
        path: postgres.json
        if-no-files-found: error
        retention-days: 1
