name: Bootstrap deployment evidence

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Delivery lane
        required: true
        type: choice
        options: [stage, production]
      mode:
        description: import-existing verifies live state; initialize-empty is non-authorizing
        required: true
        type: choice
        options: [import-existing, initialize-empty]
      resource_uuid:
        description: Exact Coolify application UUID
        required: true
      health_url:
        description: Exact HTTPS health URL
        required: true
      expected_revision:
        description: Import-existing full live revision; unused for initialize-empty
        required: false
      existing_deployment_uuid:
        description: Import-existing deployment UUID; unused for initialize-empty
        required: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: coolify-resource-${{ inputs.resource_uuid }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: ${{ inputs.lane }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Create exact bootstrap record
        env:
          BOOTSTRAP_MODE: ${{ inputs.mode }}
          LANE: ${{ inputs.lane }}
          RESOURCE_UUID: ${{ inputs.resource_uuid }}
          HEALTH_URL: ${{ inputs.health_url }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          EXISTING_DEPLOYMENT_UUID: ${{ inputs.existing_deployment_uuid }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_VERIFY_TOKEN: ${{ secrets.COOLIFY_VERIFY_TOKEN }}
        run: |
          case "$BOOTSTRAP_MODE" in
            import-existing) python3 .harness/evidence_ledger.py bootstrap-import-existing --output evidence.json ;;
            initialize-empty) python3 .harness/evidence_ledger.py bootstrap-empty --schema empty-observation-v1 --output evidence.json ;;
            *) exit 2 ;;
          esac
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bootstrap-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 90
