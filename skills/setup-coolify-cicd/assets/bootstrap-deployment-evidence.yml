name: Bootstrap deployment evidence

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Delivery lane
        required: true
        type: choice
        options: [stage, production]
      mode:
        description: import-existing verifies live state; initialize-empty is non-authorizing
        required: true
        type: choice
        options: [import-existing, initialize-empty]
      expected_revision:
        description: Import-existing full live revision; unused for initialize-empty
        required: false
      existing_deployment_uuid:
        description: Import-existing deployment UUID; unused for initialize-empty
        required: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  bootstrap:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.lane }}
    concurrency:
      group: coolify-resource-${{ vars.COOLIFY_RESOURCE_UUID }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Create exact bootstrap record
        env:
          BOOTSTRAP_MODE: ${{ inputs.mode }}
          LANE: ${{ inputs.lane }}
          RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          HEALTH_URL: ${{ vars.COOLIFY_HEALTH_URL }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          EXISTING_DEPLOYMENT_UUID: ${{ inputs.existing_deployment_uuid }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_VERIFY_TOKEN: ${{ secrets.COOLIFY_VERIFY_TOKEN }}
          COOLIFY_VERIFY_TOKEN_SCOPES: ${{ vars.COOLIFY_VERIFY_TOKEN_SCOPES }}
          COOLIFY_VERIFY_TOKEN_EXPIRES_AT: ${{ vars.COOLIFY_VERIFY_TOKEN_EXPIRES_AT }}
          COOLIFY_VERIFY_TOKEN_IP_ALLOWLISTED: ${{ vars.COOLIFY_VERIFY_TOKEN_IP_ALLOWLISTED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .harness/evidence_ledger.py assert-bootstrap-available \
            --repository "$GITHUB_REPOSITORY" --lane "$LANE" \
            --resource-uuid "$RESOURCE_UUID" --health-url "$HEALTH_URL" \
            --mode "$BOOTSTRAP_MODE"
          case "$BOOTSTRAP_MODE" in
            import-existing) python3 .harness/evidence_ledger.py bootstrap-import-existing --output evidence.json ;;
            initialize-empty) python3 .harness/evidence_ledger.py bootstrap-empty --schema empty-observation-v1 --output evidence.json ;;
            *) exit 2 ;;
          esac
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bootstrap-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 90
