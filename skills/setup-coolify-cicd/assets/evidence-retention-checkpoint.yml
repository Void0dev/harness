name: Checkpoint retained deployment evidence

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Delivery lane whose current immutable head is checkpointed
        required: true
        type: choice
        options: [stage, production]

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: coolify-resource-${{ vars.COOLIFY_RESOURCE_UUID }}
  cancel-in-progress: false

jobs:
  checkpoint:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.lane }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Resolve current immutable head and create a retention checkpoint
        env:
          LANE: ${{ inputs.lane }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_HEALTH_URL }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_VERIFY_TOKEN: ${{ secrets.COOLIFY_VERIFY_TOKEN }}
          COOLIFY_VERIFY_TOKEN_SCOPES: ${{ vars.COOLIFY_VERIFY_TOKEN_SCOPES }}
          COOLIFY_VERIFY_TOKEN_EXPIRES_AT: ${{ vars.COOLIFY_VERIFY_TOKEN_EXPIRES_AT }}
          COOLIFY_VERIFY_TOKEN_IP_ALLOWLISTED: ${{ vars.COOLIFY_VERIFY_TOKEN_IP_ALLOWLISTED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .harness/evidence_ledger.py create-retention-checkpoint \
            --repository "$GITHUB_REPOSITORY" --lane "$LANE" \
            --resource-uuid "$COOLIFY_RESOURCE_UUID" --health-url "$COOLIFY_HEALTH_URL" \
            --output evidence.json
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retention-checkpoint-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 90
