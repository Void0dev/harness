name: Agent task
description: Ask the repository harness to implement a scoped change
title: "[agent] "
labels: ["ai:backlog"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and context
      description: Include relevant paths, non-goals, and safety boundaries. Never paste secrets.
  - type: checkboxes
    id: ready
    attributes:
      label: Ready for the agent
      options:
        - label: I reviewed the scope and will apply `ai:todo` when it is ready to run.
          required: true
