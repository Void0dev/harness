services:
  issue-harness:
    image: ${HARNESS_IMAGE:?set an immutable harness image digest}
    environment:
      NODE_ENV: production
      GITHUB_APP_ID: ${GITHUB_APP_ID:?set the GitHub App ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:?set the installation ID}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      GITHUB_OWNER: ${GITHUB_OWNER:?set owner}
      GITHUB_REPO: ${GITHUB_REPO:?set repository}
      GITHUB_BASE_BRANCH: stage
      HARNESS_COMMAND_TOKEN: ${HARNESS_COMMAND_TOKEN:?set command token}
      HARNESS_HEALTH_DETAILS_TOKEN: ${HARNESS_HEALTH_DETAILS_TOKEN:?set health token}
      HARNESS_DATA_DIR: ${HARNESS_DATA_DIR:?set per-repository data directory}
      WORKSPACE_RETENTION_HOURS: ${WORKSPACE_RETENTION_HOURS:-24}
      MAX_CONCURRENT_RUNS: 1
      OPENCODE_SERVER_URL: http://opencode-web:4096
      OPENCODE_INTERNAL_TOKEN: ${OPENCODE_INTERNAL_TOKEN:?set internal token}
      OPENCODE_PARENT_DIRECTORY: /home/opencode/workspace
      OPENCODE_MODEL_ID: ${VOID_AI_MODEL_ID:?set model ID}
    volumes:
      - ${HARNESS_DATA_DIR:?set /opt/issue-harness/owner-repository}:${HARNESS_DATA_DIR:?set /opt/issue-harness/owner-repository}
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:?set the GitHub App private key path}:/run/secrets/github-app.pem:ro
    init: true
    cpus: ${HARNESS_CPU_LIMIT:-0.5}
    mem_limit: ${HARNESS_MEMORY_LIMIT:-512m}
    pids_limit: ${HARNESS_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  opencode-web:
    image: ${OPENCODE_WEB_IMAGE:?set an immutable OpenCode Web image digest}
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OpenCode password}
      OPENCODE_INTERNAL_TOKEN: ${OPENCODE_INTERNAL_TOKEN:?set internal token}
      VOID_AI_BASE_URL: ${VOID_AI_BASE_URL:-https://ai-gateway.void0.org/v1}
      VOID_AI_API_KEY_FILE: /run/secrets/void-ai-api-key
      VOID_AI_MODEL_ID: ${VOID_AI_MODEL_ID:?set model ID}
      OPENCODE_SESSION_SECRET: ${OPENCODE_SESSION_SECRET:?set session signing secret}
      OPENCODE_SESSION_TTL_SECONDS: ${OPENCODE_SESSION_TTL_SECONDS:-86400}
      OPENCODE_PROJECT_DIR: /home/opencode/workspace
      HARNESS_COMMAND_URL: http://issue-harness:3000/commands/issues
      HARNESS_ANSWER_URL: http://issue-harness:3000/commands/answers
      HARNESS_TASKS_URL: http://issue-harness:3000/ui/tasks
      HARNESS_COMMAND_TOKEN: ${HARNESS_COMMAND_TOKEN:?set command token}
    configs:
      - source: void-ai-api-key
        target: /run/secrets/void-ai-api-key
    volumes:
      - ${HARNESS_DATA_DIR:?set /opt/issue-harness/owner-repository}/opencode:/home/opencode/.local/share/opencode
      - ${HARNESS_DATA_DIR:?set /opt/issue-harness/owner-repository}/context:/home/opencode/workspace:ro
      - ${HARNESS_DATA_DIR:?set /opt/issue-harness/owner-repository}/runs:${HARNESS_DATA_DIR:?set /opt/issue-harness/owner-repository}/runs
    init: true
    cpus: ${OPENCODE_CPU_LIMIT:-2}
    mem_limit: ${OPENCODE_MEMORY_LIMIT:-4g}
    pids_limit: ${OPENCODE_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

configs:
  void-ai-api-key:
    content: ${VOID_AI_API_KEY:?set gateway key}
