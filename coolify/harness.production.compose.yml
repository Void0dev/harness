# This file is for one new Coolify Service named "harness" only.
# HARNESS_IMAGE and OPENCODE_WEB_IMAGE must be immutable digests from one trusted
# successful Publish harness images workflow run on refs/heads/main.
# After this Service is created, the installer attaches the GitHub App PEM as a
# Coolify secret file mount at /run/secrets/github-app.pem in issue-harness only.

services:
  issue-harness:
    image: ${HARNESS_IMAGE:?set an immutable ghcr.io/void0dev/issue-harness digest}
    user: "10001:10001"
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:?set the GitHub App ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:?set the GitHub App installation ID}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      GITHUB_OWNER: ${GITHUB_OWNER:?set the repository owner}
      GITHUB_REPO: ${GITHUB_REPO:?set the repository name}
      GITHUB_BASE_BRANCH: stage
      HARNESS_COMMAND_TOKEN: ${HARNESS_COMMAND_TOKEN:?set a 32+ character command token}
      HARNESS_HEALTH_DETAILS_TOKEN: ${HARNESS_HEALTH_DETAILS_TOKEN:?set a 32+ character diagnostics token}
      HARNESS_DATA_DIR: /opt/issue-harness/data
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      CONTEXT_REFRESH_SECONDS: ${CONTEXT_REFRESH_SECONDS:-60}
      WORKSPACE_RETENTION_HOURS: ${WORKSPACE_RETENTION_HOURS:-24}
      MAX_CONCURRENT_RUNS: "1"
      HEALTH_PORT: "3000"
      OPENCODE_SERVER_URL: http://opencode-web:4096
      OPENCODE_INTERNAL_TOKEN: ${OPENCODE_INTERNAL_TOKEN:?set a 32+ character internal token}
      OPENCODE_PARENT_DIRECTORY: /opt/issue-harness/data/context
      OPENCODE_MODEL_ID: ${VOID_AI_MODEL_ID:?set the gateway model ID}
    volumes:
      - type: volume
        source: harness-state
        target: /opt/issue-harness/data
      - type: volume
        source: harness-context
        target: /opt/issue-harness/data/context
      - type: volume
        source: harness-runs
        target: /opt/issue-harness/data/runs
    init: true
    cpus: ${HARNESS_CPU_LIMIT:-0.5}
    mem_limit: ${HARNESS_MEMORY_LIMIT:-512m}
    pids_limit: ${HARNESS_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  opencode-web:
    image: ${OPENCODE_WEB_IMAGE:?set an immutable ghcr.io/void0dev/opencode-web digest}
    user: "10001:10001"
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set the OpenCode Web password}
      OPENCODE_INTERNAL_TOKEN: ${OPENCODE_INTERNAL_TOKEN:?set a 32+ character internal token}
      VOID_AI_BASE_URL: ${VOID_AI_BASE_URL:-https://ai-gateway.void0.org/v1}
      VOID_AI_API_KEY: ${VOID_AI_API_KEY:?set the Void AI gateway key}
      VOID_AI_MODEL_ID: ${VOID_AI_MODEL_ID:?set the gateway model ID}
      OPENCODE_SESSION_SECRET: ${OPENCODE_SESSION_SECRET:?set a 32+ character session signing secret}
      OPENCODE_SESSION_TTL_SECONDS: ${OPENCODE_SESSION_TTL_SECONDS:-86400}
      OPENCODE_PROJECT_DIR: /opt/issue-harness/data/context
      OPENCODE_DATABASE_PATH: /home/opencode/.local/share/opencode/opencode.db
      HARNESS_COMMAND_URL: http://issue-harness:3000/commands/issues
      HARNESS_ANSWER_URL: http://issue-harness:3000/commands/answers
      HARNESS_TASKS_URL: http://issue-harness:3000/ui/tasks
      HARNESS_COMMAND_TOKEN: ${HARNESS_COMMAND_TOKEN:?set a 32+ character command token}
    volumes:
      - type: volume
        source: harness-context
        target: /opt/issue-harness/data/context
        read_only: true
      - type: volume
        source: harness-runs
        target: /opt/issue-harness/data/runs
      - type: volume
        source: opencode-state
        target: /home/opencode/.local/share/opencode
    expose:
      - "4096"
    init: true
    cpus: ${OPENCODE_CPU_LIMIT:-2}
    mem_limit: ${OPENCODE_MEMORY_LIMIT:-4g}
    pids_limit: ${OPENCODE_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  harness-state:
  harness-context:
  harness-runs:
  opencode-state:
