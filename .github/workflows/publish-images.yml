name: Publish harness images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: issue-harness
            dockerfile: services/issue-harness/Dockerfile
          - image: sandcastle-harness
            dockerfile: .sandcastle/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Normalize image name
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
      - name: Record immutable reference
        run: echo "ghcr.io/${{ steps.names.outputs.owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}" >>"$GITHUB_STEP_SUMMARY"
